services:
  infernotuffatori:
    build: .
    ports:
      # Solo per il Pi stesso: si entra dalla tailnet con https://infernotuffatori.<tailnet>.ts.net
      # (repo ingressi-https). tailscale serve dice chi è l'utente: se la porta fosse aperta alla LAN
      # chiunque potrebbe fingersi un altro. 8080-8090 sono già usate da altre app sul Pi.
      - "127.0.0.1:8091:3000"
    environment:
      # Login Tailscale (separati da virgola) che possono modificare ed eliminare ogni build: nel .env
      AMMINISTRATORI: ${AMMINISTRATORI:-}
    volumes:
      # Build, catalogo aggiornato dalla wiki, icone scaricate, backup giornalieri
      - dati:/data
    # Il codice non si scrive: solo il volume dei dati e /tmp
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/salute"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  dati:
